<section class="home-hero">

  <div id="home-map" class="home-map-container" aria-hidden="true"></div>

  <canvas #animCanvas class="home-anim-canvas" aria-hidden="true"></canvas>

  <div class="home-vignette" aria-hidden="true"></div>

  <div class="home-noise" aria-hidden="true"></div>

  <div class="home-content" [class.home-content--visible]="showContent">

    <h1 class="home-brand">
      <span class="home-brand__support">Support</span><span class="home-brand__way">Way</span>
    </h1>

    <p class="home-subtitle">Платформа взаємодопомоги</p>

    <div class="home-divider" aria-hidden="true"></div>

    <div
      class="home-greeting"
      [class.home-greeting--visible]="showContent"
      role="status"
      aria-live="polite"
    >
      <ng-container *ngIf="!isLoading; else loadingTpl">
        <ng-container *ngIf="displayName; else guestTpl">
          <span class="home-greeting__wave" aria-hidden="true">👋</span>
          <span class="home-greeting__text">
            {{ greeting }},&nbsp;<strong>{{ displayName }}</strong>
          </span>
        </ng-container>
        <ng-template #guestTpl>
          <span class="home-greeting__wave" aria-hidden="true">👋</span>
          <span class="home-greeting__text">Ласкаво просимо до <strong>SupportWay</strong></span>
        </ng-template>
      </ng-container>
      <ng-template #loadingTpl>
        <span class="home-greeting__skeleton" aria-label="Завантаження..."></span>
      </ng-template>
    </div>

    <p class="home-description">
      Знаходьте запити на допомогу поруч, публікуйте власні —<br>
      разом ми сильніші.
    </p>

    <div
      class="home-actions"
      [class.home-actions--visible]="showButtons"
      role="group"
      aria-label="Головні дії"
    >
      <button
        class="home-btn home-btn--primary"
        (click)="goToRequests()"
        aria-label="Переглянути запити на допомогу"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Запити
      </button>

      <button
        class="home-btn home-btn--secondary"
        (click)="goToMap()"
        aria-label="Відкрити карту запитів"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        Карта
      </button>

      <button
        class="home-btn home-btn--ghost"
        (click)="goToPosts()"
        aria-label="Переглянути публікації"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Публікації
      </button>
    </div>

  </div>

</section>
