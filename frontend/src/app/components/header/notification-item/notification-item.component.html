<div
  class="notification-item"
  [class.unread]="!notification.isRead"
  (click)="onClick()"
  role="button"
  tabindex="0"
  (keydown.enter)="onClick()">

  <div class="item-avatar">
    <img
      *ngIf="imageSrc && notification.type !== NotificationType.BadgeAwarded; else iconFallback"
      [src]="imageSrc"
      alt="avatar"
      class="avatar-img"
    />
    <ng-template #iconFallback>
      <div class="icon-circle" [class.badge-icon]="notification.type === NotificationType.BadgeAwarded">
        <!-- Message icon -->
        <svg *ngIf="notification.type === NotificationType.Message"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <!-- Badge icon -->
        <svg *ngIf="notification.type === NotificationType.BadgeAwarded"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/>
          <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        <!-- Badge image if available -->
        <img
          *ngIf="notification.type === NotificationType.BadgeAwarded && imageSrc"
          [src]="imageSrc"
          alt="badge"
          class="badge-img"
        />
      </div>
    </ng-template>
  </div>

  <div class="item-body">
    <p class="item-title">{{ notification.title }}</p>
    <p class="item-message">{{ notification.message }}</p>
    <span class="item-time">{{ relativeTime }}</span>
  </div>

  <div class="unread-dot" *ngIf="!notification.isRead"></div>
</div>
