<div class="notification-bell" (click)="$event.stopPropagation()">

  <button class="bell-btn" (click)="toggleDropdown($event)" aria-label="Сповіщення">
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="dropdown" [class.open]="isOpen" (click)="$event.stopPropagation()">

    <div class="dropdown-header">
      <span class="dropdown-title">Сповіщення</span>
      <button class="mark-all-btn" *ngIf="unreadCount > 0" (click)="markAllAsRead($event)">
        Позначити всі як прочитані
      </button>
    </div>

    <div class="dropdown-body">

      <div class="loading-state" *ngIf="isLoading">
        <div class="skeleton" *ngFor="let i of [1,2,3]"></div>
      </div>

      <ng-container *ngIf="!isLoading">
        <app-notification-item
          *ngFor="let n of notifications; trackBy: trackById"
          [notification]="n"
          (notificationClick)="onNotificationClick(n)">
        </app-notification-item>

        <div class="empty-state" *ngIf="notifications.length === 0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <p>Немає сповіщень</p>
        </div>
      </ng-container>

    </div>
  </div>
</div>
